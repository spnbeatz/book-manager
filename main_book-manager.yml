name: Deploy static HTML to Azure Web App - book-manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6B289C65F9841EEAA2D8E7A35106DE6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_61056755A8DC417B83CA1E6C4D8AAEC3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C099B676CD63428BAF8675AE2A19F5EC }}

      - name: Deploy static site
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'book-manager'
          slot-name: 'Production'
          package: .
